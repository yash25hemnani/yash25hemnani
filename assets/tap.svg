<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 130" width="220" height="130" role="img" aria-label="Two vibration patterns: Miss you is two heartbeats, Here for you is a slow swell">
  <style>
    .l{font:500 11px system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#8B949E}
    .w{fill:none;stroke:#E0577A;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
    .b{stroke:#8B949E;stroke-opacity:.35;stroke-width:1}
  </style>
  <text class="l" x="4" y="44">Miss you</text>
  <line class="b" x1="80" y1="40" x2="212" y2="40"/>
  <path class="w" d="M80,40 L96,40 L101,20 L106,60 L111,40 L118,40 L122,30 L126,50 L130,40 L140,40 L145,20 L150,60 L155,40 L162,40 L166,30 L170,50 L174,40 L212,40"/>
  <text class="l" x="4" y="104">Here for you</text>
  <line class="b" x1="80" y1="100" x2="212" y2="100"/>
  <path class="w" d="M80,100 C128,100 136,72 158,72 C180,72 188,100 212,100"/>
</svg>
